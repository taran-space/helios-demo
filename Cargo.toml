[package]
name = "helios-ts"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.84"
wasm-bindgen-futures = "0.4.33"
wasm-bindgen-test = "0.3.0"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"

eyre = "0.6.8"
ethers = { git = "https://github.com/gakonst/ethers-rs", rev = "3bf1a9e0d698e9fdfc91d0353878901af5a5c5ef" }
hex = "0.4.3"
serde = { version = "1.0.143", features = ["derive"] }
serde_json = "1.0.85"

client = { git = "https://github.com/a16z/helios" }
consensus = { git = "https://github.com/a16z/helios" }
execution = { git = "https://github.com/a16z/helios" }
config = { git = "https://github.com/a16z/helios" }
common = { git = "https://github.com/a16z/helios" }


[dependencies.web-sys]
version = "0.3"
features = ["console", "Storage", "Window"]
