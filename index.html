<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8" />
    <title>Helios Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">Helios Demo</div>
    <div class="note sync-note">Please ensure synchronization is complete before querying transactions</div>
    <input id="checkpointInput" placeholder="Enter checkpoint hash" />
    <button id="syncButton">Sync</button>
    <div id="latestHeader">Latest Block Hash: </div>
    <div id="latestTimestamp">Timestamp: </div>

    <div class="note block-note">Helios can only access block info from the last 64 blocks</div>
    <input id="transactionInput" placeholder="Enter transaction hash" />
    <button id="findTransactionButton">Find Transaction</button>
    <div id="transactionBlockHash">Transaction Block Hash: </div>
    
    <script src="./dist/lib.js"></script>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
    <script src="./app.js"></script> <!-- You will create this -->
</body>
</html>
