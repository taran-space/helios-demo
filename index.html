<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>hello-wasm example</title>
  </head>
  <body>
    <script src="./dist/lib.js"></script>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
    <script>
      const config = {
        executionRpc:"https://eth-mainnet.g.alchemy.com/v2/Aj5RHrooceIbmkhMmdratqUaB_KSx1Oo",
        consensusRpc: "https://www.lightclientdata.org",
        checkpoint: "0xbd384b5ecbf38c60570831ab10be6ebbe01341116d455658e21294bad82faa28",
      };

      helios.createHeliosProvider(config).then(heliosProvider => {
        heliosProvider.sync().then(() => {
          window.provider = new ethers.providers.Web3Provider(heliosProvider);
          // Get balance of an address
          const address = "0xA91584056eEB860147158c7cC90818D3f5039014";
          window.provider.getBalance(address).then((balance) => {
            console.log("Balance:", ethers.utils.formatEther(balance), "ETH");
          });
        });
      });
    </script>
  </body>
</html>
